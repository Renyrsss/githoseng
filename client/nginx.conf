server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Саму страницу отдаём всегда свежую. Пока index.html лежал в кэше
    # браузера, человек после выката продолжал видеть старую версию вместе со
    # ссылками на старые css и js — сколько бы раз мы их ни версионировали.
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Остальное версионируется через ?v= в ссылках, поэтому кэш безопасен.
    # Час, а не год: если версию забудут поднять, всё вылечится само за час.
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
