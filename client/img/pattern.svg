<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Фоновый узор HelpDesk хозяйственной службы: работа бригад и медицинский
       контекст клиники. Линии тонкие и бледные — узор читается как фактура,
       а не спорит с формой. Плитка 320×320, элементы не пересекают край,
       поэтому повтор бесшовный. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">

    <!-- Капля: сантехника -->
    <g stroke="#0a58c2" opacity="0.55">
      <path d="M44 26c0 0-17 19-17 30a17 17 0 0 0 34 0c0-11-17-30-17-30z" />
      <path d="M36 56a8 8 0 0 0 8 8" opacity="0.6" />
    </g>

    <!-- Разводной ключ: хозяйственные работы -->
    <g stroke="#1c3f63" opacity="0.45">
      <path d="M150 30a15 15 0 0 0-20 19l-24 24a7 7 0 0 0 10 10l24-24a15 15 0 0 0 19-20l-9 9-9-9z" />
    </g>

    <!-- Молния: электрики -->
    <g stroke="#4a8c22" opacity="0.5">
      <path d="M258 24l-20 34h14l-12 30 22-36h-14z" />
    </g>

    <!-- Пульс: медицинский профиль клиники -->
    <g stroke="#63b0d6" opacity="0.6">
      <path d="M18 150h26l8-18 12 34 9-16h27" />
    </g>

    <!-- Вентилятор: вентиляция -->
    <g stroke="#0a58c2" opacity="0.4">
      <circle cx="160" cy="152" r="6" />
      <path d="M160 146c-4-12 2-22 12-22 8 0 12 8 8 14-3 5-12 8-20 8z" />
      <path d="M166 152c12-4 22 2 22 12 0 8-8 12-14 8-5-3-8-12-8-20z" transform="rotate(120 160 152)" />
      <path d="M166 152c12-4 22 2 22 12 0 8-8 12-14 8-5-3-8-12-8-20z" transform="rotate(240 160 152)" />
    </g>

    <!-- Снежинка: кондиционеры -->
    <g stroke="#63b0d6" opacity="0.5">
      <path d="M270 130v44M252 141l36 22M288 141l-36 22" />
      <path d="M270 140l-6-6M270 140l6-6M270 164l-6 6M270 164l6 6" opacity="0.8" />
    </g>

    <!-- Медицинский крест -->
    <g stroke="#4a8c22" opacity="0.45">
      <path d="M52 236h14v-14h16v14h14v16h-14v14H66v-14H52z" />
    </g>

    <!-- Шестерёнка: обслуживание -->
    <g stroke="#1c3f63" opacity="0.4">
      <circle cx="164" cy="252" r="11" />
      <circle cx="164" cy="252" r="21" stroke-dasharray="4 9" stroke-width="6" opacity="0.7" />
    </g>

    <!-- Розетка: слаботочка и электрика -->
    <g stroke="#0a58c2" opacity="0.42">
      <rect x="248" y="236" width="40" height="40" rx="10" />
      <path d="M262 252v8M274 252v8" />
    </g>

    <!-- Тонкие связи между узлами, чтобы узор не рассыпался на пятна -->
    <g stroke="#1c3f63" opacity="0.14" stroke-width="1.4">
      <path d="M44 74v52M160 74v56M270 74v44M44 190v30M160 190v40M270 190v34" />
      <path d="M74 152h60M190 152h56" />
    </g>
  </g>
</svg>
